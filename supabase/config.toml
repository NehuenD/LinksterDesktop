# Supabase local development configuration.
# Makes `supabase start` / `supabase db reset` reproducible: the migrations in
# ./migrations are applied in filename order, so a fresh project materialises the
# full Linkster schema (baseline → hardening → reader → note → RLS).
#
# The Google OAuth client is injected from the environment; set
# GOOGLE_CLIENT_ID / GOOGLE_SECRET before `supabase start` to exercise sign-in.

project_id = "linkster"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["linkster://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
redirect_uri = "linkster://auth/callback"

[analytics]
enabled = false
