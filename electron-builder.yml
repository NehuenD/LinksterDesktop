appId: com.linkster.app
productName: Linkster
copyright: Copyright © 2026 Linkster
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - native/clipboard-listener/build/Release/*.node
asar: true
asarUnpack:
  - native/**
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.productivity
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Linkster
publish: null
