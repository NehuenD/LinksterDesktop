appId: com.linkster.app
productName: Linkster
copyright: Copyright © 2026 Linkster
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - native/clipboard-listener/build/Release/*.node
asar: true
asarUnpack:
  - native/**
extraResources:
  - from: resources/tray.png
    to: tray.png
protocols:
  - name: Linkster
    schemes:
      - linkster
# Harden the packaged binary: no ELECTRON_RUN_AS_NODE / --inspect entry points
# and only load code from the asar.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: NehuenD <NehuenD@users.noreply.github.com>
publish: null
